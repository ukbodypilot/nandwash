name: publish

# Pushing a tag like v0.4.0 builds the package and uploads it to PyPI. No token is stored anywhere:
# PyPI trusts this workflow directly (a "trusted publisher" set up on pypi.org: owner ukbodypilot, repo nandwash,
# workflow publish.yml, environment pypi). Off until that exists: set the repository variable PUBLISH_PYPI=true
# (Settings > Secrets and variables > Actions > Variables) to turn it on; until then the job is skipped.
on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
