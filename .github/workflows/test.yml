name: test

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install . pyflakes
      - run: python -m pyflakes nandwash tests
      - run: python -m unittest discover -s tests -v
      # The loop-device acceptance test (tests/acceptance_loop.sh) needs root and losetup: run it locally.
