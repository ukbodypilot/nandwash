[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nandwash"
version = "0.4.0"
description = "SSD NAND cell refresh utility for Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["rich>=13.0", "click>=8.0"]

[project.urls]
Homepage = "https://github.com/ukbodypilot/nandwash"
Changelog = "https://github.com/ukbodypilot/nandwash/blob/main/CHANGELOG.md"

[project.scripts]
nandwash = "nandwash.cli:main"
