[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nandwash"
version = "0.2.0"
description = "SSD NAND cell refresh utility for Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["rich>=13.0", "click>=8.0"]

[project.scripts]
nandwash = "nandwash.cli:main"
